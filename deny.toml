# cargo-deny configuration — supply-chain policy for OpenDesk.
# Run locally with: cargo deny check

[advisories]
version = 2
# RustSec advisory DB. Yanked crates warn rather than fail so a transitive
# yank doesn't break CI unexpectedly.
yanked = "warn"
# Add specific RustSec IDs here (with a comment) only for an unavoidable
# transitive advisory that has no fixed upgrade path yet.
ignore = []

[licenses]
version = 2
# Dependency licenses compatible with distributing OpenDesk under AGPL-3.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    # webpki-root-certs (Mozilla CA bundle), via the Tauri updater's HTTP client.
    "CDLA-Permissive-2.0",
    # ffmpeg-next / ffmpeg-sys-next, pulled in only by the optional `vaapi`
    # feature. WTFPL is a public-domain-equivalent permissive licence.
    "WTFPL",
]
confidence-threshold = 0.9

# Our own crates are unpublished (AGPL-3.0-only); only check dependencies.
[licenses.private]
ignore = true

[bans]
# Warn (don't fail) on duplicate versions and wildcard deps. The capture crate
# `scap` is pinned at a 0.0.x wildcard-ish version and is load-bearing; this
# surfaces it without blocking CI. Tighten to "deny" once deps stabilize.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
# Only crates.io: no git or third-party registries.
unknown-git = "deny"
