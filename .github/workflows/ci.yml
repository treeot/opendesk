name: CI

# Docs-only changes don't need a build.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".env.example"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".env.example"]

permissions:
  contents: read

jobs:
  rust:
    name: Rust protocol and relay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked -p protocol -p relay
      - run: cargo test --locked -p protocol -p relay
      - run: cargo clippy --locked -p protocol -p relay --all-targets -- -D warnings

  host-core:
    name: Rust host-core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked -p host-core
      # The end-to-end tests stand up real relay sockets and ICE. Running them
      # one at a time stops a loaded runner from starving pairing and the first
      # frame; the retry absorbs the occasional transient flake on the slow
      # macOS runner without weakening any assertion.
      - name: Test host-core
        run: |
          for attempt in 1 2 3; do
            cargo test --locked -p host-core -- --test-threads=1 && exit 0
            echo "::warning::host-core tests flaked on attempt $attempt; retrying"
          done
          exit 1
      - run: cargo clippy --locked -p host-core --all-targets -- -D warnings
      # web-core's tests run the browser session against a real host-core host.
      - name: Test web-core
        run: |
          for attempt in 1 2 3; do
            cargo test --locked -p web-core -- --test-threads=1 && exit 0
            echo "::warning::web-core tests flaked on attempt $attempt; retrying"
          done
          exit 1
      - run: cargo clippy --locked -p web-core --all-targets -- -D warnings

  tauri:
    name: Tauri Rust crate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: viewer/src-tauri -> viewer/src-tauri/target
      - run: cargo check --locked --manifest-path viewer/src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path viewer/src-tauri/Cargo.toml --all-targets -- -D warnings

  viewer:
    name: Viewer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
      - run: npx vitest run
        working-directory: viewer

  web:
    name: Browser viewer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Must match the wasm-bindgen version pinned in crates/web-core.
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: cargo clippy --locked -p web-core --target wasm32-unknown-unknown -- -D warnings
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            site/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run wasm
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx vitest run
        working-directory: web
      # The site (landing page, docs, and the viewer at /connect/).
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site

  # First-ever cross-compile of the cfg-gated Windows/Linux host code
  # (scap/enigo/cpal). These paths are never built on macOS, so this job is
  # where platform compile errors surface. `check` only; running capture/input
  # needs a real desktop session.
  host-core-cross:
    name: host-core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux audio/input deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxdo-dev libpipewire-0.3-dev libspa-0.2-dev libdbus-1-dev clang
      # libopus is built from source by opusic-sys (CMake is preinstalled).
      - run: cargo check --locked -p protocol -p relay -p host-core

  tauri-cross:
    name: tauri backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: viewer/src-tauri -> viewer/src-tauri/target
      - name: Linux Tauri + audio deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libasound2-dev libpipewire-0.3-dev libspa-0.2-dev libdbus-1-dev clang
      - run: cargo check --locked --manifest-path viewer/src-tauri/Cargo.toml

  cargo-deny:
    name: Supply-chain (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
