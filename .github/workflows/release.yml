name: Release unsigned bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned ${{ matrix.os }} bundle
    runs-on: ${{ matrix.os }}
    env:
      # Optional stable self-signed macOS cert (base64 .p12, its password, and
      # the identity name). When set, macOS bundles are signed with it so a
      # user's Screen Recording / Accessibility grants persist across updates
      # (TCC keys on the cert, not the per-build hash). Gatekeeper still warns:
      # this is not Apple notarization. Unset leaves builds ad-hoc as before.
      MACOS_SIGN_CERT: ${{ secrets.MACOS_SIGN_CERT }}
      MACOS_SIGN_CERT_PASSWORD: ${{ secrets.MACOS_SIGN_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-24.04
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libdbus-1-dev \
            clang

      # libopus is built from source by opusic-sys (CMake is preinstalled).

      - name: Install frontend dependencies
        working-directory: viewer
        run: npm ci

      # These bundles are intentionally unsigned. No signing identities,
      # certificates, notarization, or Windows signing secrets are used.
      # The only key is the updater's minisign key (see docs/RELEASE.md).
      - name: Require a default relay
        shell: bash
        env:
          OPENDESK_DEFAULT_RELAY: ${{ vars.OPENDESK_DEFAULT_RELAY }}
        run: |
          case "$OPENDESK_DEFAULT_RELAY" in
            wss://*/ws) ;;
            *) echo "Set the repo variable OPENDESK_DEFAULT_RELAY (e.g. wss://relay.example.com/ws)"; exit 1 ;;
          esac

      # The app version comes from the tag, so the updater can tell builds
      # apart. MSI only takes numeric versions: v0.1.0-beta.5 -> 0.1.0.5.
      # Without the updater key the release still builds, just without
      # updater artifacts, and installed apps won't be offered it.
      - name: Configure release version and updater
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z.]+))?$ ]]; then
            echo "::error::Tag $TAG is not vX.Y.Z or vX.Y.Z-pre.N"; exit 1
          fi
          wix="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          if [ -n "${BASH_REMATCH[5]}" ]; then
            build="$(grep -oE '[0-9]+$' <<<"${BASH_REMATCH[5]}" || true)"
            wix="$wix.${build:-0}"
          fi
          updater=true
          if [ "$HAS_UPDATER_KEY" != "true" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater artifacts. Installed apps won't be offered this release."
            updater=false
          fi
          config="$RUNNER_TEMP/release.conf.json"
          printf '{"version":"%s","bundle":{"createUpdaterArtifacts":%s,"windows":{"wix":{"version":"%s"}}}}\n' \
            "$version" "$updater" "$wix" > "$config"
          cat "$config"
          echo "TAURI_RELEASE_CONFIG=$config" >> "$GITHUB_ENV"

      # Optional: import a stable self-signed cert so macOS bundles are signed
      # with the same identity every release, keeping users' permission grants.
      # Skipped (ad-hoc build) when the secret is absent.
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_SIGN_CERT != ''
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/opendesk-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_SIGN_CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_SIGN_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # Put our keychain first in the search list so codesign finds the identity.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | sed s/\"//g)
          rm "$RUNNER_TEMP/cert.p12"
          echo "APPLE_SIGNING_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build unsigned Tauri bundles
        working-directory: viewer
        shell: bash
        env:
          OPENDESK_DEFAULT_RELAY: ${{ vars.OPENDESK_DEFAULT_RELAY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config "$TAURI_RELEASE_CONFIG"

      - name: Upload unsigned bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opendesk-${{ runner.os }}-unsigned
          # Installers and updater files only; the bundle dir also holds
          # staging trees (AppDir, .app, unpacked .deb) that aren't release
          # assets. The .sig files and the macOS .app.tar.gz exist only
          # when the updater key is set.
          path: |
            viewer/src-tauri/target/release/bundle/dmg/*.dmg
            viewer/src-tauri/target/release/bundle/macos/*.app.tar.gz
            viewer/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            viewer/src-tauri/target/release/bundle/appimage/*.AppImage
            viewer/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            viewer/src-tauri/target/release/bundle/deb/*.deb
            viewer/src-tauri/target/release/bundle/deb/*.deb.sig
            viewer/src-tauri/target/release/bundle/rpm/*.rpm
            viewer/src-tauri/target/release/bundle/rpm/*.rpm.sig
            viewer/src-tauri/target/release/bundle/nsis/*-setup.exe
            viewer/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            viewer/src-tauri/target/release/bundle/msi/*.msi
            viewer/src-tauri/target/release/bundle/msi/*.msi.sig
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish unsigned release artifacts
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # To start the site build below.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts

      # Tauri names it OpenDesk.app.tar.gz; give it a versioned asset name.
      - name: Name the macOS update archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for archive in release-artifacts/*/macos/*.app.tar.gz; do
            [ -e "$archive" ] || continue
            target="$(dirname "$archive")/OpenDesk_${TAG#v}_aarch64.app.tar.gz"
            mv "$archive" "$target"
            if [ -e "$archive.sig" ]; then mv "$archive.sig" "$target.sig"; fi
          done
          find release-artifacts -type f | sort

      # Release assets remain unsigned; users may need to bypass Gatekeeper,
      # SmartScreen, or Linux desktop trust prompts when launching them.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          # Tags like v0.1.0-beta.1 are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: .github/RELEASE_NOTES.md
          generate_release_notes: true
          files: release-artifacts/**/*

      # Installed apps poll one fixed URL:
      #   https://github.com/<repo>/releases/download/updater/latest.json
      # /releases/latest/download/ would skip pre-releases, and every beta is
      # one, so the manifest lives on its own "updater" pre-release and is
      # replaced on each publish. See docs/RELEASE.md.
      - name: Update the updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          dir="$RUNNER_TEMP/updater"
          mkdir -p "$dir"
          if gh release view updater --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download updater --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$dir" || true
            if [ -e "$dir/latest.json" ]; then mv "$dir/latest.json" "$dir/previous.json"; fi
          else
            gh release create updater --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "Updater manifest" \
              --notes "Used by the OpenDesk in-app updater. Download installers from the versioned releases."
          fi
          node .github/scripts/updater-manifest.mjs release-artifacts "$TAG" "$GITHUB_REPOSITORY" \
            "$dir/latest.json" "$dir/previous.json"
          if [ -e "$dir/latest.json" ]; then
            gh release upload updater "$dir/latest.json" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "::warning::Updater manifest not updated; installed apps won't be offered $TAG."
          fi

      # The site's download buttons are baked in at build time. A release
      # made with this token doesn't trigger other workflows, so start the
      # site build explicitly.
      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
