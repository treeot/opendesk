name: Relay image

# Only when something that goes into the relay image changes.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - crates/relay/**
      - crates/protocol/**
      - Cargo.toml
      - Cargo.lock
      - .dockerignore
      - .github/workflows/docker.yml
  pull_request:
    branches: [main]
    paths:
      - crates/relay/**
      - crates/protocol/**
      - Cargo.toml
      - Cargo.lock
      - .dockerignore
      - .github/workflows/docker.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build relay image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/opendesk-relay
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: crates/relay/Dockerfile
          # arm64 builds under emulation (slow), so only for releases.
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image must start and answer /health.
      - name: Smoke test
        run: |
          docker buildx build --load -t relay-smoke -f crates/relay/Dockerfile --cache-from type=gha .
          docker run -d --name relay -p 8080:8080 relay-smoke
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/health && exit 0; sleep 1; done
          docker logs relay; exit 1
