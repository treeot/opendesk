name: Site (Pages)

# Builds site/ (landing page, docs, and the browser viewer at /connect/ with
# the web-core wasm) and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web/**"
      - "crates/web-core/**"
      - "crates/protocol/**"
      - "viewer/src/lib/decode.ts"
      - "viewer/src/lib/video.ts"
      - "viewer/src/lib/input.ts"
      - "viewer/src/styles.css"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  # release.yml dispatches this after publishing, so the download links
  # point at the new release.
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling a
# deployment halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Must match the wasm-bindgen version pinned in crates/web-core.
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Require a default relay
        env:
          OPENDESK_DEFAULT_RELAY: ${{ vars.OPENDESK_DEFAULT_RELAY }}
        run: |
          case "$OPENDESK_DEFAULT_RELAY" in
            wss://*/ws) ;;
            *) echo "Set the repo variable OPENDESK_DEFAULT_RELAY (e.g. wss://relay.example.com/ws)"; exit 1 ;;
          esac
      # The viewer page imports web/src, which loads this wasm build.
      - run: npm run wasm
        working-directory: web
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          OPENDESK_DEFAULT_RELAY: ${{ vars.OPENDESK_DEFAULT_RELAY }}
          # Read-only lookup of the newest release for the download links.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
