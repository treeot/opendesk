[package]
name = "relay"
version = "0.1.0"
publish = false
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "relay"
path = "src/lib.rs"

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
tokio = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
# Already in the tree through axum. Used directly for the accept loop, which
# needs hyper's header read timeout that axum::serve does not expose.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
dashmap = "6"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tokio-tungstenite = "0.30"
