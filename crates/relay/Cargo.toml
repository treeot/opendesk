[package]
name = "relay"
version = "0.1.0"
publish = false
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "relay"
path = "src/lib.rs"

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
tokio = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
dashmap = "6"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tokio-tungstenite = "0.29"
