[package]
name = "host-core"
version = "0.1.0"
publish = false
license = "AGPL-3.0-only"
edition = "2021"

[dependencies]
async-trait = "0.1"
protocol = { path = "../protocol" }
tokio = { workspace = true }
# wss:// relays: rustls with the OS trust store. tokio-tungstenite pulls in
# rustls with no crypto backend, so pick ring (builds everywhere with a C
# compiler) and install it in relay_client::connect.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
openh264 = "0.9"
scap = "0.0.8"
enigo = "0.6"
webrtc-ice = "0.17"
webrtc-util = "0.17"
sha2 = "0.11"
totp-lite = "2"
cpal = "0.18"
opus = "0.4"
arboard = "3.6.1"
log = "0.4"
# Optional: hardware H.264 on Linux via VAAPI (the `vaapi` feature). Off by
# default because it needs the system ffmpeg development libraries; enabling it
# links libavcodec/libavutil. Experimental, needs validation on Linux hardware.
ffmpeg-next = { version = "9.0", optional = true }

[features]
# Build the experimental VAAPI hardware encoder (Linux only at runtime).
vaapi = ["dep:ffmpeg-next"]

# PulseAudio host (pure Rust; also talks to pipewire-pulse) for capturing the
# default sink's monitor. Not cpal's "pipewire" feature: it needs pipewire
# 0.10, which conflicts with scap's pipewire 0.8 over libpipewire linking.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# CGVirtualDisplay (private CoreGraphics classes) for virtual displays.
# Already in the tree through arboard and cpal.
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn"] }
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = ["std", "VTBase", "VTCompressionProperties", "VTCompressionSession", "VTErrors", "VTSession", "objc2-core-media", "objc2-core-video"] }

# Not used directly: scap 0.0.8 accepts any windows-capture 1.x, but 1.5
# changed Settings::new and breaks scap's Windows build. Cap it here.
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = ">=1.3.6, <2.1"
# Device installation, IO, registry, security, shell and threading: the
# virtual display driver (vdisplay/windows.rs).
windows = { version = "0.62.2", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
relay = { path = "../relay" }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-tungstenite = "0.30"
