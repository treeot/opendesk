# Standalone workspace: the Tauri app is not a member of the repo-root workspace.
[workspace]

[package]
name = "viewer"
version = "0.1.0"
publish = false
license = "AGPL-3.0-only"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
keyring = "4"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
protocol = { path = "../../crates/protocol" }
host-core = { path = "../../crates/host-core" }
scap = "0.0.8"
rand = "0.9"
tokio = { version = "1", features = ["sync", "rt", "time"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
async-trait = "0.1"
opus = "0.4"
log = "0.4"
tauri-plugin-log = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
