# Standalone workspace: the Tauri app is not a member of the repo-root workspace.
[workspace]

[package]
name = "viewer"
version = "0.1.0"
publish = false
license = "AGPL-3.0-only"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
base64 = "0.23"
keyring = "4"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
protocol = { path = "../../crates/protocol" }
host-core = { path = "../../crates/host-core" }
scap = "0.0.8"
rand = "0.10"
tokio = { version = "1", features = ["sync", "rt", "time"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
async-trait = "0.1"
opus = "0.4"
log = "0.4"
tauri-plugin-log = "2.10"
tauri-plugin-dialog = "2"
qrcode = { version = "0.14", default-features = false }
tauri-plugin-updater = "2.13.3"
tauri-plugin-process = "2.4.0"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.4"
sha2 = "0.11"

# Already in the tree through tauri-plugin-autostart; reads MachineGuid.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.100"
# Downloading and unpacking Amyuni's virtual display driver (vdriver.rs).
# Both already in the tree on Windows through tauri-plugin-updater.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }
# zip's deflate needs a backend picked; the pure-Rust one.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_RemoteDesktop", "Win32_System_Threading"] }

[dev-dependencies]
# vdriver.rs unpacks a zip in its tests on every platform.
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }
# zip's deflate needs a backend picked; the pure-Rust one.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Optimize dependencies in dev builds; capture, crypto and codecs crawl at opt-level 0.
[profile.dev.package."*"]
opt-level = 2
